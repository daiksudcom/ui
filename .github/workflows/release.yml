name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to re-release; defaults to the current main revision
        required: false
        type: string

# Tagging and publication stay in one workflow because a push made with GITHUB_TOKEN never
# starts another workflow run, so a separate tag workflow could not trigger publication
# without introducing a personal access token.
concurrency:
  group: ui-package-release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag the revision
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      core-changed: ${{ steps.tag.outputs.core-changed }}
    env:
      TARGET_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - name: Verify the revision is contained in main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - name: Resolve the tag for this revision
        id: tag
        run: |
          set -euo pipefail
          resolved=$(node .github/scripts/policy.mjs revision "$TARGET_SHA")
          printf 'tag=%s\n' "$(jq -r .tag <<<"$resolved")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(jq -r .version <<<"$resolved")" >> "$GITHUB_OUTPUT"
          printf 'core-changed=%s\n' "$(jq -r .coreChanged <<<"$resolved")" >> "$GITHUB_OUTPUT"
      # The build identifier is derived from the commit, so a retried run resolves the same
      # tag name and this step becomes a no-op instead of creating a second tag.
      - name: Create the tag when it does not exist yet
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$existing" ]]; then
            if [[ "$(git rev-parse "${existing}^{commit}")" != "$TARGET_SHA" ]]; then
              printf 'Tag %s already points elsewhere; refusing to move it.\n' "$TAG" >&2
              exit 1
            fi
            printf 'Tag %s already exists for this revision; continuing the interrupted release.\n' "$TAG"
            exit 0
          fi
          git tag --annotate "$TAG" --message "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"

  gated:
    name: Publication gate
    needs: tag
    if: needs.tag.outputs.core-changed == 'true' && vars.PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Report the closed publication gate
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          printf 'PUBLISH_ENABLED is not true; %s was tagged but nothing was published.\n' "$TAG"

  publish:
    name: Publish package
    needs: tag
    # A build identifier marks a revision that changed no published contract, so only a
    # SemVer core change reaches the registry and the GitHub Release.
    if: needs.tag.outputs.core-changed == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-packages
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@daiksudme'
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Pack the release artifact
        id: pack
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/daiksudme-ui-${VERSION}.tgz"
          pnpm pack --out "$tarball"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          printf 'sha512-%s  %s\n' \
            "$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)" \
            "$(basename "$tarball")" > "$RUNNER_TEMP/package-integrity.txt"
      - name: Validate package contents
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: node .github/scripts/package-smoke.mjs package "$TARBALL" "$VERSION"
      - name: Validate a clean consumer installation
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: node .github/scripts/package-smoke.mjs consumer "$TARBALL" "$VERSION"
      - name: Attest package provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      # An identical digest is the continuation of an interrupted release; any other digest
      # is an immutability violation. Only transient registry faults are retried, and a
      # retry never re-tags the revision.
      - name: Publish or verify the immutable package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: node .github/scripts/publish-package.mjs
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ needs.tag.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null || true)
          if [[ -n "$state" && "$(jq -r .isDraft <<<"$state")" == false ]]; then
            printf 'GitHub Release %s already exists; continuing the interrupted release.\n' "$TAG"
            exit 0
          fi
          if [[ -z "$state" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "@daiksudme/ui ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" \
            "${TARBALL}#$(basename "$TARBALL")" \
            "$RUNNER_TEMP/package-integrity.txt#package-integrity.txt" \
            "${PROVENANCE}#provenance.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
